name: Dev Notes to Discord

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  post-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post commits to Discord with embeds
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_NOTES_WEBHOOK }}
        with:
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;

            if (!webhookUrl) {
              core.setFailed("Missing secret: DISCORD_DEV_NOTES_WEBHOOK");
              return;
            }

            const commits = context.payload.commits || [];
            if (commits.length === 0) {
              console.log("No commits to post");
              return;
            }

            const branch = context.ref.replace("refs/heads/", "");

            const fields = commits.map(c => {
              // Discord embed field values cap at 1024 chars, and a full
              // commit body (subject + bullet list) can exceed that and
              // get the whole payload rejected with a 400 — show just the
              // subject line, truncated as a safety net for a long one.
              let subject = c.message.split("\n")[0];
              if (subject.length > 200) subject = subject.slice(0, 197) + "...";
              return {
                name: context.actor,
                value: `[${subject}](${c.url})`
              };
            });

            const payload = {
              embeds: [
                {
                  title: `📝 ${commits.length} new commit${commits.length > 1 ? "s" : ""} pushed`,
                  description: `Branch: **${branch}**\n🌐 [verselist.gospelgo.org](https://verselist.gospelgo.org)`,
                  color: 0x1abc9c,
                  fields,
                  footer: { text: "VerseList Dev Notes" },
                  timestamp: new Date().toISOString()
                }
              ]
            };

            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Discord webhook failed (${response.status}): ${body}`);
              return;
            }

            console.log(`Discord webhook sent: HTTP ${response.status}`);
